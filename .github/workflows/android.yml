name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    # ✅ SAFE Java setup (NO PPA, NO timeout)
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ✅ Install required tools
    - name: 🧰 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip git zip unzip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libtinfo6 \
          cmake libffi-dev libssl-dev

        pip install --upgrade pip
        pip install buildozer "cython<3.0"

    # ✅ Build APK (Buildozer handles SDK automatically)
    - name: Build APK
  run:buildozer android debug --verbose
    # ✅ Upload APK
    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: bin/*.apk