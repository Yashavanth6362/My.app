name: Flutter Android Build

# Controls when the workflow runs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check-out your code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter using the official action
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0' # Latest stable as of 2025
          channel: 'stable'

      # 3. Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Setup Java 17 - Compatible with modern Gradle/AGP
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. FIX: Generate Gradle Wrapper if it's missing
      # This step creates the gradlew script and wrapper jar if they don't exist
      - name: Generate Gradle Wrapper (if missing)
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found. Generating..."
            gradle wrapper --gradle-version 7.5
          else
            echo "Gradle wrapper found."
          fi

      # 6. FIX: Grant execute permission to gradlew
      # This solves the "Permission denied" problem
      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      # 7. Update Android SDK and accept licenses
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      # 8. Build the APK!
      - name: Build APK
        run: flutter build apk --debug

      # 9. Upload the built APK as an artifact so you can download it
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk