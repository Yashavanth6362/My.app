name: Build Website APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🟢 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📦 Install dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli

    # ✅ Create web folder
    - name: 🌐 Prepare web files
      run: |
        mkdir -p www
        cp index.html www/index.html || true

    # ✅ INIT Capacitor (IMPORTANT)
    - name: ⚙️ Init Capacitor
      run: |
        npx cap init MyApp com.myapp.app --web-dir=www || true

    # ✅ ADD ANDROID (THIS WAS MISSING)
    - name: 📱 Add Android
      run: |
        npx cap add android

    # ✅ Sync files
    - name: 🔄 Sync
      run: |
        npx cap sync

    # ✅ Java setup
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ✅ Build APK
    - name: 🔨 Build APK
      run: |
        cd android
        ./gradlew assembleDebug

    # ✅ Upload APK
    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: android/app/build/outputs/apk/debug/app-debug.apk