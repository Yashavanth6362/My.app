name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🟢 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📦 Install dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: 🌐 Prepare web app
      run: |
        mkdir -p www
        cp index.html www/index.html || true

    - name: ⚙️ Init Capacitor
      run: |
        npx cap init MyApp com.myapp.app --web-dir=www

    - name: 📱 Add Android platform
      run: |
        npx cap add android

    - name: 🔄 Sync project
      run: |
        npx cap sync

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🔨 Build APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: android/app/build/outputs/apk/debug/app-debug.apk